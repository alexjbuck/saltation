# Example saltation config for the walkthrough.
#
# `saltation.toml` is normally next to your `current.sql` and `committed/`
# directory. Run `saltation` from this directory (or pass --path) and the
# relative `dir = "."` resolves to the directory you're in.

[catalog]
# The values under [catalog] are passed straight through to PyIceberg's
# `load_catalog()`. Anything PyIceberg accepts for a REST catalog goes here.
type      = "rest"
uri       = "http://localhost:9181/catalog"
warehouse = "saltation-example"

# S3 endpoint (rustfs) + static credentials. In real life these belong in
# the environment, not the file - see the commented-out block below for
# the production pattern.
"s3.endpoint"          = "http://localhost:9001"
"s3.access-key-id"     = "saltation-access-key"
"s3.secret-access-key" = "saltation-secret-key"
"s3.region"            = "local"
"s3.path-style-access" = "true"

# Production pattern: resolve secrets from the environment via ${VAR}.
# `saltation` substitutes ${VAR} references at load time and fails loud
# if any are unset. Literal `${...}` is `$${...}` (make-style escape).
#
# token                 = "${SALTATION_CATALOG_TOKEN}"
# "s3.access-key-id"    = "${AWS_ACCESS_KEY_ID}"
# "s3.secret-access-key"= "${AWS_SECRET_ACCESS_KEY}"

[evolutions]
# Where `current.sql` and `committed/*.sql` live. Relative to the cwd
# `saltation` is invoked from.
dir               = "."
sidecar_namespace = "_saltation"

[dev]
# Idempotent is the default and the safety contract. `reset` is opt-in for
# evolutions that genuinely can't be expressed idempotently.
mode        = "idempotent"
watch       = true
debounce_ms = 500

[views]
# SQL dialects each view version stores. A view's query is written once in
# saltation's Spark SQL and transpiled by sqlglot into every dialect listed;
# an engine only reads views stored in a dialect it understands.
dialects = ["spark"]
# Dialect view bodies are written in (default "spark"). Its representation is
# stored verbatim, so existing views (e.g. Trino) migrate without rewrites.
# Columns saltation can't type from the catalog take a type in the view's
# column list: CREATE VIEW v (id STRING, ts TIMESTAMP) AS <body>.
# source_dialect = "trino"
#
# A view can also carry a hand-written body per engine; those are stored
# verbatim and only the configured dialects without one are transpiled:
#   CREATE OR REPLACE VIEW v (id STRING)
#     DIALECT trino AS $$ SELECT ... $$
#     DIALECT spark AS $$ SELECT ... $$;
