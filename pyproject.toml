[project]
name = "saltation"
version = "0.1.0"
description = "SQL-driven table evolution runner for Apache Iceberg tables, powered by PyIceberg."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Buck", email = "alexjbuck@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Database",
  "Topic :: Software Development :: Version Control",
]
dependencies = [
  "pyarrow>=24.0.0",
  "pydantic>=2.13.4",
  "pyiceberg[pyiceberg-core]>=0.12.0",
  "sqlglot>=30.8.0",
  "typer>=0.25.1",
  "watchfiles>=1.2.0",
]

[project.scripts]
saltation = "saltation.cli:app"

[project.urls]
Repository = "https://github.com/alexjbuck/saltation"
Documentation = "https://github.com/alexjbuck/saltation#readme"
Changelog = "https://github.com/alexjbuck/saltation/blob/main/CHANGELOG.md"
Issues = "https://github.com/alexjbuck/saltation/issues"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
# Declare saltation as its own workspace root so it doesn't get pulled into
# any parent pyproject.toml's workspace.
members = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
# S101: asserts state invariants in src; saltation is never run with -O.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "S105", "S108", "S110", "S310", "S603", "S607", "S608"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src", "tests", "scripts", "packaging"]

[tool.ty.rules]
# Strict by default in src/; per-file relaxations live alongside the offending code.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.coverage.run]
source = ["saltation"]
branch = true
relative_files = true

[tool.coverage.paths]
source = ["src/saltation", "*/site-packages/saltation"]

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[dependency-groups]
dev = [
  "griffe>=2.4.1",
  "hypothesis>=6.152.9",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.14",
  "syrupy>=5.2.0",
  "ty>=0.0.39",
]
engines = [
    "duckdb>=2.0.0",
    "pymysql>=1.2.3",
    "pyspark-client>=4.1,<4.2",
    "trino>=0.340.0",
]
package = [
    "pyinstaller>=6.22.3",
]
