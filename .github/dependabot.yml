# Weekly dependency updates. Every PR needs a change file or the
# no-changeset label (changeset.yml); automated bumps get the label, and a
# maintainer adds a change file when a runtime bump matters to users.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    # Let a release settle before adopting it, so a yanked or compromised
    # version has time to be caught upstream first.
    cooldown:
      default-days: 7
    labels: [dependencies, python, no-changeset]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    # Let a release settle before adopting it, so a yanked or compromised
    # version has time to be caught upstream first.
    cooldown:
      default-days: 7
    labels: [dependencies, github-actions, no-changeset]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - /docker
      - /docker/polaris
      - /docker/gravitino
      - /docker/engines/*
      - /examples
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    # Let a release settle before adopting it, so a yanked or compromised
    # version has time to be caught upstream first.
    cooldown:
      default-days: 7
    labels: [dependencies, docker, no-changeset]
    commit-message:
      prefix: "chore(rig)"
    groups:
      rig-images:
        patterns: ["*"]
