name: Feature request
description: Propose new SQL surface, a command, a flag, a config key, or other new behaviour. Required before any feature PR.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features are coordinated through an issue before any code is written. Please wait for a maintainer to agree on the design before opening a pull request; feature PRs without an accepted issue are closed.

        Some areas are out of scope for v1 (see the "Out of scope for v1" list in [CONTRIBUTING.md](https://github.com/alexjbuck/saltation/blob/main/CONTRIBUTING.md#out-of-scope-for-v1)): `INSERT ... SELECT`, `MERGE`, and query-driven `DELETE`; declarative-diff mode; Nessie or branch-based dev workflows; cross-catalog evolutions; RBAC and table maintenance as first-class concepts; static idempotency lint checks; and multi-developer `current.sql` collaboration.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem are you trying to solve, and why can't you solve it with saltation today? Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed SQL or CLI surface
      description: Show exactly what a user would write or run, and what it would do. For SQL, cite the Iceberg Spark DDL syntax it follows. Explain how it stays idempotent when re-applied.
      placeholder: |
        ALTER TABLE ns.t ... ;

        $ saltation <command> --<flag>
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs, workarounds you use today, and how other tools handle this.
    validations:
      required: true
  - type: dropdown
    id: out-of-scope
    attributes:
      label: Does this touch the out-of-scope list?
      description: If it does, explain in the motivation why it should be reconsidered.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: Public contract impact
      description: Would this change existing CLI output, JSON fields, exit codes, config keys, or on-disk formats (see docs/compatibility.md)?
      options:
        - Additive only
        - Changes or removes existing behaviour
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this once the design is agreed.
          required: false
