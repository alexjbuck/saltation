name: changeset

# Release notes are written per PR as .changeset/*.md files (knope
# document-change). A PR with nothing user-facing takes the no-changeset label.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  changeset:
    if: github.head_ref != 'release' && !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a change file
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only --diff-filter=AM "$BASE"...HEAD -- '.changeset/*.md' | grep -q .; then
            echo "::error::Add a change file with 'knope document-change' (or a .changeset/*.md by hand), or label the PR no-changeset."
            exit 1
          fi
