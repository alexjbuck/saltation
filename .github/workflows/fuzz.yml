name: fuzz

# Weekly long run of the catalog-free fuzz and property tests. The Hypothesis
# example database is cached across runs so failures found once keep replaying.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      max_examples:
        description: Hypothesis examples per test
        default: "2000"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Restore the Hypothesis example database
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .hypothesis
          key: hypothesis-fuzz-${{ github.run_id }}
          restore-keys: hypothesis-fuzz-

      - name: pytest (fuzz + property)
        env:
          HYPOTHESIS_PROFILE: fuzz
          HYPOTHESIS_MAX_EXAMPLES: ${{ inputs.max_examples || '2000' }}
        run: uv run pytest tests/unit -k "fuzz or property" -n auto

      - name: Upload the Hypothesis database
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypothesis-fuzz-${{ github.run_id }}
          path: .hypothesis/
          include-hidden-files: true
          retention-days: 30
