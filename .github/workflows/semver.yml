name: semver

# A PR that breaks the public contract (Python API, CLI commands/options/exit
# codes, --json keys) must carry a `default: major` change file. See
# docs/compatibility.md. No label opts out: a break always needs one.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Git ref to compare the branch against
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    if: github.head_ref != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check breaking changes against the base branch
        env:
          BASE: ${{ github.base_ref || inputs.base }}
        run: uv run python scripts/check_semver.py --base "origin/$BASE" --style github
