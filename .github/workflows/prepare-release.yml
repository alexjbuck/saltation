name: prepare-release

# Every push to main turns the pending .changeset/ files into a version bump
# and CHANGELOG entry on the `release` branch, and opens (or refreshes) the
# release PR. Merging it runs release.yml. See docs/releasing.md.

on:
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions: {}

jobs:
  prepare-release:
    # The release PR's own merge has nothing left to release.
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # knope pushes the release branch with the checkout's token, so the
      # credentials must persist here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          # A PR opened with the default token doesn't trigger CI on itself.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Pending changesets?
        id: pending
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .changeset/*.md files; nothing to release."
          fi

      - name: Install uv
        if: steps.pending.outputs.any
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.pending.outputs.any
        with:
          version: 0.23.2

      - name: Open or refresh the release PR
        if: steps.pending.outputs.any
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          knope prepare-release --verbose
