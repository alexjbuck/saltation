name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly soak: same suites, large Hypothesis budget (see tests/conftest.py).
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      hypothesis-profile:
        description: Hypothesis profile (dev, ci, nightly)
        default: ci
        type: string

# The event name keeps the nightly soak out of main's push group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  HYPOTHESIS_PROFILE: ${{ inputs.hypothesis-profile || (github.event_name == 'schedule' && 'nightly' || 'ci') }}

jobs:
  lint-type-test:
    name: lint + type + unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check src tests scripts packaging

      - name: ruff format --check
        run: uv run ruff format --check src tests scripts packaging

      - name: ty check
        run: uv run ty check src tests scripts

      - name: pytest (unit, with coverage)
        run: >-
          uv run pytest tests/unit -n auto
          --cov --cov-branch --cov-report=xml:coverage-unit-py${{ matrix.python-version }}.xml
          --cov-report=term-missing:skip-covered

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Unit coverage (py${PY})"
            echo
            uv run coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PY: ${{ matrix.python-version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-unit-py${{ matrix.python-version }}
          path: coverage-unit-*.xml
          if-no-files-found: ignore

  lock:
    name: lockfile is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: uv lock --check
        run: uv lock --check

      - name: Build metadata is consistent
        run: uv build --no-cache --out-dir "$RUNNER_TEMP/dist" && ls "$RUNNER_TEMP/dist"

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  integration:
    name: integration (${{ matrix.catalog }})
    needs: lint-type-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # One job per REST catalog, each on its latest stable release (pins in
    # docker/**/compose.yml); tests/integration/rig.py maps the name to a
    # stack and client properties. Single Python pin: the sweep from
    # lint-type-test would add cost without value.
    strategy:
      fail-fast: false
      matrix:
        catalog: [lakekeeper, polaris, gravitino]
    env:
      SALTATION_TEST_CATALOG: ${{ matrix.catalog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify docker compose is available
        run: docker compose version

      - name: Map host.docker.internal to localhost
        # The rustfs storage endpoint vended to clients is
        # http://host.docker.internal:9000 so that both the catalog
        # container (via host-gateway) and the host-side test process
        # resolve to the same place. Docker Desktop populates this entry
        # on macOS/Windows automatically; Linux GHA runners do not.
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: pytest (integration)
        # The fixture brings the stack up with docker compose up -d
        # (no --wait, see conftest for the rationale) and tears it down
        # on exit, so no separate compose step is needed.
        run: >-
          uv run pytest tests/integration -v
          --cov --cov-branch --cov-report=xml:coverage-integration-${{ matrix.catalog }}.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-integration-${{ matrix.catalog }}
          path: coverage-integration-*.xml
          if-no-files-found: ignore

      - name: V1 smoke - saltation apply --json
        # Re-bring up the stack (pytest's session fixture tore it down on
        # exit) and exercise the production code path end-to-end: the same
        # command and JSON-parse pipeline a CI deploy would run.
        env:
          UV_PROJECT_ENVIRONMENT: .venv
        run: |
          compose=$(uv run python -m tests.integration.rig compose)
          health=$(uv run python -m tests.integration.rig health)
          smoke_toml="$RUNNER_TEMP/saltation.toml"
          { uv run python -m tests.integration.rig toml; cat tests/fixtures/v1-smoke/saltation.toml; } > "$smoke_toml"
          docker compose -f "$compose" up -d
          for _ in $(seq 1 90); do
            if curl -fsS "$health" >/dev/null 2>&1 \
              && docker compose -f "$compose" ps -a \
                  --format '{{.Service}} {{.State}} {{.ExitCode}}' \
                  | grep -q '^bootstrap exited 0$'; then
              break
            fi
            sleep 2
          done
          uv run saltation init --path "$smoke_toml"
          uv run saltation apply --json --path "$smoke_toml" | tee "$RUNNER_TEMP/apply.json"
          status=$(jq -r .status "$RUNNER_TEMP/apply.json")
          test "$status" = "applied" || test "$status" = "unchanged"
          uv run saltation apply --json --path "$smoke_toml" | tee "$RUNNER_TEMP/apply2.json"
          test "$(jq -r .status "$RUNNER_TEMP/apply2.json")" = "unchanged"

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f "$(uv run python -m tests.integration.rig compose)" logs --no-color || true
