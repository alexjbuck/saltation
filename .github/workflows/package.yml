name: package

# Builds everything a release ships and proves it runs on every platform:
#   wheel          sdist + py3-none-any wheel, twine-checked
#   install-smoke  the wheel installed with uv on 5 OS/arch x 3 Pythons
#   binaries       standalone PyInstaller bundles (no Python needed), one
#                  archive + .sha256 per target, smoke-run after extraction
#   attest         build-provenance attestations (release builds only)
# Runs on every PR so release day holds no surprises; release.yml calls it
# with attest: true and attaches the artifacts to the GitHub release.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (default: the selected branch)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (default: the triggering ref)"
        type: string
        required: false
        default: ""
      attest:
        description: "Create build-provenance attestations for the outputs"
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: "The project version that was built"
        value: ${{ jobs.wheel.outputs.version }}

# A new push to a PR supersedes its previous run; release calls never share a
# group (run_id), so nothing cancels them.
concurrency:
  group: package-${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build

      - name: Check the dists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls dist/
          test -f "dist/saltation-$VERSION-py3-none-any.whl"
          test -f "dist/saltation-$VERSION.tar.gz"
          test "$(find dist -name '*.whl' | wc -l)" -eq 1
          uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-smoke:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install the wheel into a fresh venv
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON" smoke-venv
          uv pip install --python smoke-venv dist/*.whl

      - name: Run it
        env:
          VERSION: ${{ needs.wheel.outputs.version }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exe=smoke-venv/Scripts/saltation.exe; else exe=smoke-venv/bin/saltation; fi
          out=$("$exe" --version | tr -d '\r')
          echo "$out"
          if [ "$out" != "saltation $VERSION" ]; then
            echo "::error::expected 'saltation $VERSION', got '$out'"
            exit 1
          fi
          "$exe" --help
          mkdir -p smoke
          printf '[catalog]\ntype = "rest"\nuri = "http://127.0.0.1:9/catalog"\nwarehouse = "smoke"\n\n[evolutions]\ndir = "./evolutions"\n' > smoke/saltation.toml
          "$exe" config check --path smoke/saltation.toml

  binaries:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-latest }
          - { target: linux-aarch64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x86_64, os: macos-15-intel }
          - { target: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.wheel.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      # uv's managed CPython (python-build-standalone) ships a shared
      # libpython for PyInstaller to embed and, on Linux, targets glibc 2.17,
      # so the bundle isn't pinned to the runner's glibc the way the
      # toolcache interpreter would pin it.
      - name: Install the locked runtime dependencies and PyInstaller
        env:
          UV_PYTHON_DOWNLOADS: auto
        run: uv sync --frozen --no-dev --no-editable --group package --managed-python

      - name: Build the bundle
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging/saltation.spec

      - name: Archive
        env:
          COPYFILE_DISABLE: "1"
        run: |
          name="saltation-$VERSION-$TARGET"
          mkdir -p stage out
          mv dist/saltation "stage/$name"
          cp LICENSE packaging/README.md "stage/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            (cd stage && 7z a -tzip -bb0 "../out/$archive" "$name")
          else
            archive="$name.tar.gz"
            tar -C stage -czf "out/$archive" "$name"
          fi
          cd out
          if command -v sha256sum > /dev/null; then sha256=(sha256sum); else sha256=(shasum -a 256); fi
          "${sha256[@]}" "$archive" > "$archive.sha256"
          cat "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      # From the extracted archive in a fresh directory: proves the bundle is
      # self-contained and relocatable, not just runnable where it was built.
      - name: Smoke-run the extracted bundle
        run: |
          name="saltation-$VERSION-$TARGET"
          archive="$PWD/out/$ARCHIVE"
          if command -v sha256sum > /dev/null; then sha256=(sha256sum); else sha256=(shasum -a 256); fi
          (cd out && "${sha256[@]}" -c "$ARCHIVE.sha256")
          extract="$PWD/../saltation-smoke"
          mkdir -p "$extract"
          cd "$extract"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bb0 "$archive"
            exe="$PWD/$name/saltation.exe"
          else
            tar -xzf "$archive"
            exe="$PWD/$name/saltation"
          fi
          out=$("$exe" --version | tr -d '\r')
          echo "$out"
          if [ "$out" != "saltation $VERSION" ]; then
            echo "::error::expected 'saltation $VERSION', got '$out'"
            exit 1
          fi
          "$exe" --help > /dev/null
          printf '[catalog]\ntype = "rest"\nuri = "http://127.0.0.1:9/catalog"\nwarehouse = "smoke"\n\n[evolutions]\ndir = "./evolutions"\n' > saltation.toml
          "$exe" config check --path saltation.toml
          # Loading a REST catalog walks pyiceberg's import-by-string paths; an
          # unreachable endpoint must fail on the network, never on an import.
          if "$exe" status --path saltation.toml > status.log 2>&1; then
            cat status.log
            echo "::error::status against an unreachable catalog succeeded"
            exit 1
          fi
          tail -n 5 status.log
          if grep -E "No module named|ModuleNotFoundError|Could not initialize" status.log; then
            echo "::error::the bundle is missing a module"
            exit 1
          fi
          grep -qi "connect" status.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  attest:
    needs: [wheel, binaries]
    # Attestation needs an OIDC token, which fork PRs never get. Only builds
    # that are about to be released ask for it.
    if: >-
      inputs.attest
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: subjects/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: subjects/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            subjects/*.whl
            subjects/*.tar.gz
            subjects/*.zip
