name: release

# Merging the release PR (opened by prepare-release.yml) tags v<version>,
# creates the GitHub release with the built dists, publishes to TestPyPI,
# installs from there, and then waits on the `pypi` environment's required
# reviewers before publishing to PyPI. workflow_dispatch republishes an
# existing tag (e.g. after fixing a PyPI-side problem). See docs/releasing.md.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.2.0"
        required: true

# Every closed PR into main starts this workflow. Only real releases share a
# group: GitHub keeps one pending run per group, so a no-op run in it would
# replace (cancel) a release queued behind one awaiting approval.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.head_ref == 'release') && 'release' || format('release-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged && github.head_ref == 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.pull_request.merge_commit_sha }}

      - uses: astral-sh/setup-uv@v6

      - name: Version
        id: version
        run: |
          version=$(uv version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.tag }}" ] && [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::tag ${{ inputs.tag }} holds version $version"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the dists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls dist/*-"$VERSION"-py3-none-any.whl dist/*-"$VERSION".tar.gz
          uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.2

      - name: Tag and create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release --verbose

  testpypi:
    needs: [build, github-release]
    # github-release is skipped on workflow_dispatch (the tag already exists).
    if: always() && needs.build.result == 'success' && needs.github-release.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/saltation
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  testpypi-install:
    needs: [build, testpypi]
    if: always() && needs.testpypi.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6

      - name: Install the TestPyPI upload and run it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Only saltation comes from TestPyPI (its dependencies there can be
          # squatted or stale); everything else resolves from PyPI.
          for attempt in 1 2 3 4 5 6; do
            if uvx pip download --no-deps --dest wheel \
                --index-url https://test.pypi.org/simple/ "saltation==$VERSION"; then
              break
            fi
            sleep $((attempt * 10))
          done
          wheel=$(ls wheel/*.whl)
          uv run --no-project --with "$wheel" -- saltation --version | tee version.txt
          grep -qx "saltation $VERSION" version.txt

  pypi:
    needs: [build, testpypi-install]
    if: always() && needs.testpypi-install.result == 'success'
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment: this job waits for
    # their approval before anything reaches PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/saltation
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.3
