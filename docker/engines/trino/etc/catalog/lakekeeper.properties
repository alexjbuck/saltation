# Iceberg REST catalog (Lakekeeper) + rustfs, as seen from inside the
# saltation-test network. Property names checked against the Trino 484 docs
# (object-storage/metastores, object-storage/file-system-s3).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=saltation
# Static rustfs credentials instead of Lakekeeper's vended ones: the vended
# endpoint is http://host.docker.internal:9000, which only resolves via
# host-gateway.
iceberg.rest-catalog.vended-credentials-enabled=false

# Trino 484 spells the native S3 switch fs.s3.enabled; releases before the
# rename used fs.native-s3.enabled. An "unused configuration property" error
# at startup means the pin and the name disagree.
fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=local
s3.path-style-access=true
s3.aws-access-key=saltation-access-key
s3.aws-secret-key=saltation-secret-key
# If INSERTs fail against rustfs with a signing/encoding error, try
# s3.chunked-encoding-enabled=false and s3.expect-continue-enabled=false
# (both added in Trino 484 for S3-compatible stores).
