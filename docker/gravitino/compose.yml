# Integration-test rig for cambrian against Apache Gravitino's standalone
# Iceberg REST catalog server.
#
# Services:
#   rustfs       - S3-compatible object storage (warehouse data lives here)
#   rustfs-init  - one-shot: creates the warehouse bucket on rustfs
#   gravitino    - Gravitino Iceberg REST server (JDBC/SQLite backend)
#   bootstrap    - one-shot: waits for GET /iceberg/v1/config, exits 0
#
# Version pins (chosen 2026-10-28):
#   rustfs/rustfs:1.0.4            - same as the Lakekeeper rig
#   apache/gravitino-iceberg-rest:1.3.1   - latest stable (tag v1.3.1,
#                                           image pushed 2026-09-30).
#                                           NOTE: Docker Hub ``latest``
#                                           still points at 1.3.0.
#
# No warehouse property on the client: Gravitino reads it as a catalog name.

name: cambrian-test-gravitino

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: cambrian-access-key
      RUSTFS_SECRET_KEY: cambrian-secret-key
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:9000/ | grep -E '^(200|403)$'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "9000:9000"
    networks:
      - cambrian

  rustfs-init:
    image: amazon/aws-cli:2.17.16
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: cambrian-access-key
      AWS_SECRET_ACCESS_KEY: cambrian-secret-key
      AWS_DEFAULT_REGION: local
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        out=$$(aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket cambrian-warehouse 2>&1) && rc=0 || rc=$$?
        echo "$$out"
        if [ "$$rc" -eq 0 ]; then exit 0; fi
        if echo "$$out" | grep -qE 'BucketAlreadyOwnedByYou|BucketAlreadyExists'; then exit 0; fi
        exit "$$rc"
    networks:
      - cambrian

  gravitino:
    image: apache/gravitino-iceberg-rest:1.3.1
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      # The image's start script (bin/rewrite_config.py) maps these
      # GRAVITINO_ICEBERG_REST_* vars onto gravitino.iceberg-rest.* keys in
      # conf/gravitino-iceberg-rest-server.conf before launching.
      GRAVITINO_ICEBERG_REST_CATALOG_BACKEND: jdbc
      # File-backed SQLite (driver ships in the image). Do NOT use the image's
      # implicit ``jdbc:sqlite::memory:`` URI: each pooled connection would get
      # its own empty database. The file lives in the container's writable
      # layer: survives ``restart``, discarded by ``down``.
      GRAVITINO_ICEBERG_REST_URI: "jdbc:sqlite:/tmp/cambrian-iceberg.db"
      GRAVITINO_ICEBERG_REST_JDBC_DRIVER: org.sqlite.JDBC
      GRAVITINO_ICEBERG_REST_JDBC_USER: iceberg
      GRAVITINO_ICEBERG_REST_JDBC_PASSWORD: iceberg
      GRAVITINO_ICEBERG_REST_WAREHOUSE: "s3://cambrian-warehouse/warehouse"
      GRAVITINO_ICEBERG_REST_IO_IMPL: org.apache.iceberg.aws.s3.S3FileIO
      # Server-side S3FileIO config AND the values vended to clients in
      # loadTable/createTable ``config``. PyIceberg lets table config override
      # catalog properties, so this endpoint must resolve from both the
      # gravitino container and the host test process (same trick as the
      # Lakekeeper rig; needs ``127.0.0.1 host.docker.internal`` on Linux
      # hosts/CI).
      GRAVITINO_ICEBERG_REST_S3_ENDPOINT: "http://host.docker.internal:9000"
      GRAVITINO_ICEBERG_REST_S3_REGION: local
      GRAVITINO_ICEBERG_REST_S3_PATH_STYLE_ACCESS: "true"
      GRAVITINO_ICEBERG_REST_S3_ACCESS_KEY: cambrian-access-key
      GRAVITINO_ICEBERG_REST_S3_SECRET_KEY: cambrian-secret-key
      # PyIceberg >=0.7 always sends ``X-Iceberg-Access-Delegation:
      # vended-credentials``; without a provider for the s3 scheme Gravitino
      # rejects table loads/creates ("No credential provider found ...").
      # s3-secret-key vends the static keys above.
      GRAVITINO_ICEBERG_REST_CREDENTIAL_PROVIDERS: s3-secret-key
      # Belt-and-braces for the AWS SDK v2 default chains (region lookup and
      # flexible-checksum defaults that some S3-compatible stores reject).
      AWS_REGION: local
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      GRAVITINO_MEM: "-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /v1/config forces the default catalog wrapper (JDBC backend) to load,
      # so a broken backend config fails the healthcheck. python3 is present
      # in the image; curl is not guaranteed.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/iceberg/v1/config', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s
    ports:
      - "8181:9001"
    networks:
      - cambrian

  bootstrap:
    image: curlimages/curl:8.10.1
    depends_on:
      gravitino:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        body=$$(curl -fsS http://gravitino:9001/iceberg/v1/config)
        echo "[bootstrap] /v1/config: $$body"
        echo "$$body" | grep -q 'views' || { echo "[bootstrap] view endpoints missing"; exit 1; }
        echo "[bootstrap] gravitino ready"
    networks:
      - cambrian

networks:
  cambrian:
    name: cambrian-test-gravitino
